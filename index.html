<script>
  // Simple in-browser storage stand-in (since this is not running inside Claude anymore).
  // Everything is saved in this browser's localStorage instead.
  window.storage = {
    async get(key) {
      const val = localStorage.getItem(key);
      if (val === null) throw new Error('not found');
      return { key, value: val, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

const CATEGORIES = [...new Set(BUSINESSES.map(b => b.category))];
const AREAS = [...new Set(BUSINESSES.map(b => b.area).filter(a => a && a !== 'Not identified'))].sort();

const RUBRIC = [
  { key: 'quality', label: 'How was the quality of what they delivered?', short: 'Quality of work' },
  { key: 'reliability', label: 'Did they deliver on time, as promised?', short: 'Reliability' },
  { key: 'communication', label: 'How was communication throughout?', short: 'Communication' },
  { key: 'value', label: 'Was it good value for what you paid?', short: 'Value for money' },
];

function initials(name) {
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d}d ago`;
  return `${Math.floor(d / 30)}mo ago`;
}

function Stars({ value, onChange, size = 22 }) {
  return (
    <div style={{ display: 'flex', gap: 6 }}>
      {[1, 2, 3, 4, 5].map(n => (
        <span
          key={n}
          onClick={() => onChange && onChange(n)}
          style={{
            fontSize: size,
            cursor: onChange ? 'pointer' : 'default',
            color: n <= value ? '#E8A800' : '#C7D4E3',
            userSelect: 'none',
          }}
        >★</span>
      ))}
    </div>
  );
}

function ScorePill({ score }) {
  if (score == null) return <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 11, color: '#8B98A5' }}>New</span>;
  return (
    <span style={{
      fontFamily: 'IBM Plex Mono, monospace', fontWeight: 600, fontSize: 12,
      background: '#E4F3E9', color: '#1B7A43', padding: '3px 9px', borderRadius: 20,
    }}>{score.toFixed(1)}</span>
  );
}

function Avatar({ name, size = 40 }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: size * 0.28, background: '#FFC53D',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'Sora, sans-serif', fontWeight: 800, fontSize: size * 0.36, color: '#101C2C', flex: '0 0 auto',
    }}>{initials(name)}</div>
  );
}

function Chip({ children, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      fontFamily: 'IBM Plex Mono, monospace', fontSize: 11, whiteSpace: 'nowrap',
      padding: '7px 12px', borderRadius: 20, border: `1px solid ${active ? '#101C2C' : '#C7D4E3'}`,
      background: active ? '#101C2C' : '#fff', color: active ? '#fff' : '#5C6B7A',
      cursor: 'pointer',
    }}>{children}</button>
  );
}

function Button({ children, onClick, variant = 'solid', style, disabled }) {
  const base = {
    fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 13.5,
    padding: '13px 16px', borderRadius: 12, border: 'none', cursor: disabled ? 'not-allowed' : 'pointer',
    width: '100%', textAlign: 'center', opacity: disabled ? 0.5 : 1,
  };
  const variants = {
    solid: { background: '#101C2C', color: '#fff' },
    yellow: { background: '#FFC53D', color: '#101C2C' },
    ghost: { background: 'transparent', color: '#101C2C', border: '1.5px solid #101C2C' },
  };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...variants[variant], ...style }}>{children}</button>;
}

function Header({ onHome, onMod, pendingCount }) {
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '16px 20px', borderBottom: '2px solid #101C2C', marginBottom: 4,
    }}>
      <div onClick={onHome} style={{ cursor: 'pointer', fontFamily: 'Sora, sans-serif', fontWeight: 800, fontSize: 18 }}>
        Naija<span style={{ color: '#E8A800' }}>Rated</span>
      </div>
      <div onClick={onMod} style={{
        cursor: 'pointer', fontFamily: 'IBM Plex Mono, monospace', fontSize: 10.5, color: '#5C6B7A',
        border: '1px solid #C7D4E3', borderRadius: 20, padding: '5px 10px', display: 'flex', alignItems: 'center', gap: 6,
      }}>
        Moderator
        {pendingCount > 0 && (
          <span style={{ background: '#C1442A', color: '#fff', borderRadius: 10, fontSize: 9, padding: '1px 6px' }}>{pendingCount}</span>
        )}
      </div>
    </div>
  );
}

function computeScore(reviews) {
  const approved = reviews.filter(r => r.status === 'approved');
  if (approved.length === 0) return null;
  const perCriterion = {};
  RUBRIC.forEach(({ key }) => {
    perCriterion[key] = approved.reduce((s, r) => s + r.ratings[key], 0) / approved.length;
  });
  const overall = RUBRIC.reduce((s, { key }) => s + perCriterion[key], 0) / RUBRIC.length;
  const recommendPct = Math.round((approved.filter(r => r.recommend).length / approved.length) * 100);
  return { overall, perCriterion, recommendPct, count: approved.length };
}

function App() {
  const [view, setView] = useState('home');
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [selectedAreaFilter, setSelectedAreaFilter] = useState(null);
  const [selectedBiz, setSelectedBiz] = useState(null);
  const [search, setSearch] = useState('');
  const [reviews, setReviews] = useState({}); // bizId -> [review]
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);

  // Load reviews from storage
  useEffect(() => {
    (async () => {
      try {
        const idx = await window.storage.get('review-index', false);
        const ids = idx ? JSON.parse(idx.value) : [];
        const byBiz = {};
        for (const id of ids) {
          try {
            const r = await window.storage.get(`review:${id}`, false);
            if (r) {
              const rev = JSON.parse(r.value);
              byBiz[rev.bizId] = byBiz[rev.bizId] || [];
              byBiz[rev.bizId].push(rev);
            }
          } catch (e) {}
        }
        setReviews(byBiz);
      } catch (e) {
        console.error('load error', e);
      }
      setLoaded(true);
    })();
  }, []);

  async function saveReview(review) {
    try {
      const idx = await window.storage.get('review-index', false).catch(() => null);
      const ids = idx ? JSON.parse(idx.value) : [];
      ids.push(review.id);
      await window.storage.set('review-index', JSON.stringify(ids), false);
      await window.storage.set(`review:${review.id}`, JSON.stringify(review), false);
      setReviews(prev => ({
        ...prev,
        [review.bizId]: [...(prev[review.bizId] || []), review],
      }));
    } catch (e) {
      console.error('save error', e);
    }
  }

  async function updateReviewStatus(review, status) {
    const updated = { ...review, status };
    try {
      await window.storage.set(`review:${review.id}`, JSON.stringify(updated), false);
      setReviews(prev => ({
        ...prev,
        [review.bizId]: prev[review.bizId].map(r => r.id === review.id ? updated : r),
      }));
      setToast(status === 'approved' ? 'Review approved — now live' : 'Review rejected');
      setTimeout(() => setToast(null), 2200);
    } catch (e) {
      console.error(e);
    }
  }

  const allPending = useMemo(() => {
    return Object.values(reviews).flat().filter(r => r.status === 'pending');
  }, [reviews]);

  const filteredHome = useMemo(() => {
    if (!search.trim()) return [];
    const q = search.toLowerCase();
    return BUSINESSES.filter(b => b.name.toLowerCase().includes(q) || b.category.toLowerCase().includes(q)).slice(0, 8);
  }, [search]);

  const topRated = useMemo(() => {
    return [...BUSINESSES]
      .filter(b => b.extRating)
      .sort((a, b) => parseFloat(b.extRating) - parseFloat(a.extRating))
      .slice(0, 6);
  }, []);

  function goCategory(cat) {
    setSelectedCategory(cat);
    setSelectedAreaFilter(null);
    setView('category');
  }
  function goBiz(biz) {
    setSelectedBiz(biz);
    setView('profile');
  }

  const categoryBusinesses = useMemo(() => {
    if (!selectedCategory) return [];
    let list = BUSINESSES.filter(b => b.category === selectedCategory);
    if (selectedAreaFilter) list = list.filter(b => b.area === selectedAreaFilter);
    return list.sort((a, b) => (parseFloat(b.extRating) || 0) - (parseFloat(a.extRating) || 0));
  }, [selectedCategory, selectedAreaFilter]);

  const bizReviews = selectedBiz ? (reviews[selectedBiz.id] || []) : [];
  const bizScore = computeScore(bizReviews);
  const bizApproved = bizReviews.filter(r => r.status === 'approved');

  return (
    <div style={{
      minHeight: '100vh',
      background: 'linear-gradient(#DCE4EE 1px, transparent 1px), linear-gradient(90deg, #DCE4EE 1px, transparent 1px), #EEF1F5',
      backgroundSize: '28px 28px',
      fontFamily: 'Inter, sans-serif', color: '#101C2C',
    }}>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

      <div style={{ maxWidth: 480, margin: '0 auto', background: '#F7F9FB', minHeight: '100vh', boxShadow: '0 0 40px rgba(16,28,44,0.08)' }}>
        <Header onHome={() => setView('home')} onMod={() => setView('mod')} pendingCount={allPending.length} />

        {toast && (
          <div style={{
            margin: '10px 16px', padding: '10px 14px', background: '#101C2C', color: '#fff',
            borderRadius: 10, fontSize: 12, fontFamily: 'IBM Plex Mono, monospace',
          }}>{toast}</div>
        )}

        {view === 'home' && (
          <div style={{ padding: '12px 0 40px' }}>
            <div style={{ padding: '0 16px 14px' }}>
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search a business or service…"
                style={{
                  width: '100%', padding: '12px 14px', borderRadius: 12, border: '1px solid #C7D4E3',
                  background: '#EEF1F5', fontSize: 13, fontFamily: 'Inter, sans-serif', outline: 'none',
                }}
              />
            </div>

            {search.trim() ? (
              <>
                <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#5C6B7A', padding: '4px 16px 8px' }}>
                  {filteredHome.length ? `${filteredHome.length} result${filteredHome.length > 1 ? 's' : ''}` : 'No matches'}
                </div>
                {filteredHome.length === 0 && (
                  <div style={{ padding: '20px 16px', fontSize: 12, color: '#8B98A5' }}>
                    No exact match. Try browsing a category below instead.
                  </div>
                )}
                {filteredHome.map(b => (
                  <BizRow key={b.id} biz={b} onClick={() => goBiz(b)} score={computeScore(reviews[b.id] || [])} />
                ))}
              </>
            ) : (
              <>
                <div style={{ display: 'flex', gap: 6, padding: '0 16px 16px', overflowX: 'auto' }}>
                  {CATEGORIES.map(c => (
                    <Chip key={c} onClick={() => goCategory(c)}>{c}</Chip>
                  ))}
                </div>
                <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#5C6B7A', padding: '4px 16px 8px' }}>
                  Top rated in Lagos
                </div>
                {topRated.map((b, i) => (
                  <BizRow key={b.id} biz={b} rank={i + 1} onClick={() => goBiz(b)} score={computeScore(reviews[b.id] || [])} />
                ))}
              </>
            )}
          </div>
        )}

        {view === 'category' && selectedCategory && (
          <div style={{ padding: '12px 0 40px' }}>
            <div style={{ padding: '0 16px 12px', display: 'flex', alignItems: 'center', gap: 8 }}>
              <span onClick={() => setView('home')} style={{ cursor: 'pointer', fontSize: 14 }}>←</span>
              <span style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 15 }}>{selectedCategory}</span>
            </div>
            <div style={{ display: 'flex', gap: 6, padding: '0 16px 14px', overflowX: 'auto' }}>
              <Chip active={!selectedAreaFilter} onClick={() => setSelectedAreaFilter(null)}>All areas</Chip>
              {AREAS.filter(a => BUSINESSES.some(b => b.category === selectedCategory && b.area === a)).map(a => (
                <Chip key={a} active={selectedAreaFilter === a} onClick={() => setSelectedAreaFilter(a)}>{a}</Chip>
              ))}
            </div>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#5C6B7A', padding: '4px 16px 8px' }}>
              {categoryBusinesses.length} business{categoryBusinesses.length !== 1 ? 'es' : ''}
            </div>
            {categoryBusinesses.length === 0 && (
              <div style={{ padding: '20px 16px', fontSize: 12, color: '#8B98A5' }}>No businesses match this area yet.</div>
            )}
            {categoryBusinesses.map((b, i) => (
              <BizRow key={b.id} biz={b} rank={i + 1} onClick={() => goBiz(b)} score={computeScore(reviews[b.id] || [])} showArea />
            ))}
          </div>
        )}

        {view === 'profile' && selectedBiz && (
          <ProfileView
            biz={selectedBiz}
            score={bizScore}
            approvedReviews={bizApproved}
            onBack={() => setView(selectedCategory ? 'category' : 'home')}
            onRate={() => setView('rate')}
          />
        )}

        {view === 'rate' && selectedBiz && (
          <RateView
            biz={selectedBiz}
            onCancel={() => setView('profile')}
            onSubmit={async (data) => {
              const review = {
                id: `rev-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                bizId: selectedBiz.id,
                bizName: selectedBiz.name,
                reviewerName: data.reviewerName || 'Anonymous',
                ratings: data.ratings,
                recommend: data.recommend,
                text: data.text,
                submittedAt: Date.now(),
                status: 'pending',
                flags: data.flags,
              };
              await saveReview(review);
              setView('profile');
              setToast('Thanks — your review is being checked before it goes live.');
              setTimeout(() => setToast(null), 3000);
            }}
          />
        )}

        {view === 'mod' && (
          <ModView
            pending={allPending}
            onDecide={updateReviewStatus}
            onBack={() => setView('home')}
          />
        )}

        {!loaded && <div style={{ padding: 20, fontSize: 12, color: '#8B98A5' }}>Loading…</div>}
      </div>
    </div>
  );
}

function BizRow({ biz, rank, onClick, score, showArea }) {
  return (
    <div onClick={onClick} style={{
      margin: '0 16px 10px', background: '#fff', border: '1px solid #C7D4E3', borderRadius: 14,
      padding: 12, display: 'flex', gap: 10, alignItems: 'center', cursor: 'pointer',
    }}>
      {rank && <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, fontWeight: 600, color: '#8B98A5', width: 16 }}>{rank}</div>}
      <Avatar name={biz.name} size={38} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.25 }}>{biz.name}</div>
        <div style={{ fontSize: 10.5, color: '#8B98A5', marginTop: 2 }}>
          {biz.category}{showArea ? '' : biz.area && biz.area !== 'Not identified' ? ` · ${biz.area}` : ''}
        </div>
      </div>
      <ScorePill score={score ? score.overall : (biz.extRating ? parseFloat(biz.extRating) : null)} />
    </div>
  );
}

function ProfileView({ biz, score, approvedReviews, onBack, onRate }) {
  return (
    <div style={{ padding: '12px 0 40px' }}>
      <div style={{ padding: '0 16px 12px' }}>
        <span onClick={onBack} style={{ cursor: 'pointer', fontSize: 14 }}>← Back</span>
      </div>
      <div style={{ textAlign: 'center', padding: '0 16px 14px' }}>
        <div style={{ margin: '0 auto 10px' }}><Avatar name={biz.name} size={56} /></div>
        <div style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 16 }}>{biz.name}</div>
        <div style={{ fontSize: 11, color: '#8B98A5', marginTop: 2 }}>
          {biz.category}{biz.area && biz.area !== 'Not identified' ? ` · ${biz.area}` : ''}
        </div>
        <div style={{
          display: 'inline-flex', marginTop: 8, fontFamily: 'IBM Plex Mono, monospace', fontSize: 9.5,
          background: score ? '#E4F3E9' : '#EEF1F5', color: score ? '#1B7A43' : '#5C6B7A',
          padding: '4px 9px', borderRadius: 20,
        }}>{score ? '✓ Rated on NaijaRated' : 'Listed, not yet rated'}</div>
      </div>

      <div style={{ display: 'flex', gap: 8, padding: '10px 16px 14px' }}>
        <a href={`tel:${biz.phone || ''}`} style={{ flex: 1, textDecoration: 'none' }}>
          <Button variant="solid" style={{ fontSize: 12, padding: 10 }}>📞 Call</Button>
        </a>
        <a
          href={`https://www.google.com/maps/search/${encodeURIComponent(biz.address || biz.name + ' Lagos')}`}
          target="_blank" rel="noreferrer" style={{ flex: 1, textDecoration: 'none' }}
        >
          <Button variant="ghost" style={{ fontSize: 12, padding: 10 }}>📍 Directions</Button>
        </a>
      </div>

      {score ? (
        <>
          <div style={{ textAlign: 'center', padding: '10px 16px 14px', borderBottom: '1px dashed #C7D4E3', marginBottom: 12 }}>
            <span style={{ fontFamily: 'Sora, sans-serif', fontWeight: 800, fontSize: 34 }}>{score.overall.toFixed(1)}</span>
            <span style={{ fontSize: 14, color: '#8B98A5' }}>/5</span>
            <div style={{ fontSize: 10.5, color: '#5C6B7A', marginTop: 4 }}>
              {score.recommendPct}% would recommend · {score.count} review{score.count !== 1 ? 's' : ''}
            </div>
          </div>
          {RUBRIC.map(({ key, short }) => (
            <div key={key} style={{ padding: '0 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 11.5, marginBottom: 9 }}>
              <span style={{ color: '#5C6B7A' }}>{short}</span>
              <div style={{ flex: 1, height: 5, background: '#EEF1F5', borderRadius: 6, margin: '0 8px', overflow: 'hidden' }}>
                <div style={{ height: '100%', background: '#E8A800', borderRadius: 6, width: `${(score.perCriterion[key] / 5) * 100}%` }} />
              </div>
              <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontWeight: 600, width: 26, textAlign: 'right' }}>{score.perCriterion[key].toFixed(1)}</span>
            </div>
          ))}
          <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#5C6B7A', padding: '16px 16px 8px' }}>
            What people said
          </div>
          {approvedReviews.slice().reverse().map(r => (
            <div key={r.id} style={{ margin: '0 16px 10px', background: '#fff', border: '1px solid #C7D4E3', borderRadius: 14, padding: 12, display: 'flex', gap: 10, alignItems: 'flex-start' }}>
              <Avatar name={r.reviewerName} size={34} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 600 }}>{r.reviewerName} <span style={{ fontWeight: 400, color: '#8B98A5', fontSize: 10 }}>· {timeAgo(r.submittedAt)}</span></div>
                <div style={{ fontSize: 11, marginTop: 4, lineHeight: 1.4 }}>"{r.text}"</div>
              </div>
              <ScorePill score={(r.ratings.quality + r.ratings.reliability + r.ratings.communication + r.ratings.value) / 4} />
            </div>
          ))}
        </>
      ) : (
        <div style={{ textAlign: 'center', padding: '20px 24px' }}>
          <div style={{ fontSize: 30, marginBottom: 8 }}>✦</div>
          <div style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 14, marginBottom: 6 }}>No ratings yet</div>
          <div style={{ fontSize: 11.5, color: '#5C6B7A', lineHeight: 1.5 }}>
            Used this business? Be the first to rate them and help someone else decide.
          </div>
        </div>
      )}

      <div style={{ padding: '16px 16px 0' }}>
        <Button variant="yellow" onClick={onRate}>{score ? 'Rate this business' : 'Be the first to rate'}</Button>
      </div>
    </div>
  );
}

function RateView({ biz, onCancel, onSubmit }) {
  const [step, setStep] = useState(1);
  const [ratings, setRatings] = useState({ quality: 0, reliability: 0, communication: 0, value: 0 });
  const [recommend, setRecommend] = useState(null);
  const [text, setText] = useState('');
  const [reviewerName, setReviewerName] = useState('');

  const step1Ready = ratings.quality > 0 && ratings.reliability > 0 && ratings.communication > 0;
  const step2Ready = ratings.value > 0 && recommend !== null && text.trim().length >= 5;

  function submit() {
    const flags = [];
    if (text.trim().length < 15) flags.push('short review');
    onSubmit({ ratings, recommend, text: text.trim(), reviewerName: reviewerName.trim(), flags });
  }

  return (
    <div style={{ padding: '12px 0 40px' }}>
      <div style={{ padding: '0 16px 12px' }}>
        <span onClick={onCancel} style={{ cursor: 'pointer', fontSize: 14 }}>← Rate {biz.name}</span>
      </div>
      <div style={{ padding: '0 16px 16px', display: 'flex', gap: 4 }}>
        {[1, 2].map(s => (
          <div key={s} style={{ flex: 1, height: 3, borderRadius: 3, background: s <= step ? '#101C2C' : '#C7D4E3' }} />
        ))}
      </div>

      {step === 1 && (
        <>
          {RUBRIC.slice(0, 3).map(({ key, label }) => (
            <div key={key} style={{ padding: '0 18px', marginBottom: 20 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10, lineHeight: 1.3 }}>{label}</div>
              <Stars value={ratings[key]} onChange={v => setRatings(r => ({ ...r, [key]: v }))} />
            </div>
          ))}
          <div style={{ padding: '8px 16px 0' }}>
            <Button disabled={!step1Ready} onClick={() => setStep(2)}>Continue</Button>
          </div>
        </>
      )}

      {step === 2 && (
        <>
          <div style={{ padding: '0 18px', marginBottom: 20 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Was it good value for what you paid?</div>
            <Stars value={ratings.value} onChange={v => setRatings(r => ({ ...r, value: v }))} />
          </div>
          <div style={{ padding: '0 18px', marginBottom: 20 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Would you recommend them to a friend?</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <div onClick={() => setRecommend(true)} style={{
                flex: 1, textAlign: 'center', padding: 10, borderRadius: 10, cursor: 'pointer',
                border: `1.5px solid ${recommend === true ? '#1B7A43' : '#C7D4E3'}`,
                color: recommend === true ? '#1B7A43' : '#5C6B7A',
                background: recommend === true ? '#E4F3E9' : 'transparent', fontSize: 12, fontWeight: 600,
              }}>Yes</div>
              <div onClick={() => setRecommend(false)} style={{
                flex: 1, textAlign: 'center', padding: 10, borderRadius: 10, cursor: 'pointer',
                border: `1.5px solid ${recommend === false ? '#C1442A' : '#C7D4E3'}`,
                color: recommend === false ? '#C1442A' : '#5C6B7A',
                background: recommend === false ? '#FBEAE6' : 'transparent', fontSize: 12, fontWeight: 600,
              }}>No</div>
            </div>
          </div>
          <div style={{ padding: '0 18px', marginBottom: 14 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Tell us what happened</div>
            <textarea
              value={text} onChange={e => setText(e.target.value)}
              placeholder="What did they do well, or what went wrong?"
              style={{
                width: '100%', height: 80, border: '1.5px solid #C7D4E3', borderRadius: 10, padding: 10,
                fontSize: 12, fontFamily: 'Inter, sans-serif', resize: 'none', outline: 'none', boxSizing: 'border-box',
              }}
            />
          </div>
          <div style={{ padding: '0 18px', marginBottom: 20 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Your name (shown with your review)</div>
            <input
              value={reviewerName} onChange={e => setReviewerName(e.target.value)}
              placeholder="e.g. Tolu A."
              style={{
                width: '100%', border: '1.5px solid #C7D4E3', borderRadius: 10, padding: 10,
                fontSize: 12, fontFamily: 'Inter, sans-serif', outline: 'none', boxSizing: 'border-box',
              }}
            />
          </div>
          <div style={{ padding: '0 16px' }}>
            <Button disabled={!step2Ready} onClick={submit}>Submit review</Button>
          </div>
        </>
      )}
    </div>
  );
}

function ModView({ pending, onDecide, onBack }) {
  return (
    <div style={{ padding: '12px 0 40px' }}>
      <div style={{ padding: '0 16px 14px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <span onClick={onBack} style={{ cursor: 'pointer', fontSize: 14 }}>←</span>
        <span style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: 15 }}>Review queue</span>
      </div>
      <div style={{ padding: '0 16px 14px' }}>
        <div style={{
          border: '1px solid #FFC53D', background: '#FFF8E8', borderRadius: 12, padding: '10px 14px',
          fontSize: 11.5, color: '#5C6B7A',
        }}>
          {pending.length} review{pending.length !== 1 ? 's' : ''} awaiting approval. Nothing goes live until you approve it here.
        </div>
      </div>
      {pending.length === 0 && (
        <div style={{ padding: '30px 16px', textAlign: 'center', fontSize: 12, color: '#8B98A5' }}>
          Queue is clear. New submissions will show up here.
        </div>
      )}
      {pending.slice().reverse().map(r => (
        <div key={r.id} style={{ margin: '0 16px 12px', background: '#fff', border: '1px solid #C7D4E3', borderRadius: 14, padding: 14 }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
            {r.flags && r.flags.length > 0 ? r.flags.map((f, i) => (
              <span key={i} style={{
                fontFamily: 'IBM Plex Mono, monospace', fontSize: 9, background: '#FBEAE6', color: '#C1442A',
                padding: '3px 7px', borderRadius: 6,
              }}>⚠ {f}</span>
            )) : (
              <span style={{
                fontFamily: 'IBM Plex Mono, monospace', fontSize: 9, background: '#E4F3E9', color: '#1B7A43',
                padding: '3px 7px', borderRadius: 6,
              }}>✓ no flags</span>
            )}
          </div>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 3 }}>
            {r.bizName} <span style={{ fontWeight: 400, color: '#8B98A5' }}>· by {r.reviewerName} · {timeAgo(r.submittedAt)}</span>
          </div>
          <div style={{ display: 'flex', gap: 10, fontSize: 10.5, color: '#5C6B7A', marginBottom: 6 }}>
            <span>Quality {r.ratings.quality}★</span>
            <span>Reliability {r.ratings.reliability}★</span>
            <span>Comms {r.ratings.communication}★</span>
            <span>Value {r.ratings.value}★</span>
            <span>{r.recommend ? '👍 recommends' : '👎 would not'}</span>
          </div>
          <div style={{ fontSize: 11.5, marginBottom: 12, lineHeight: 1.4 }}>"{r.text}"</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <div onClick={() => onDecide(r, 'approved')} style={{
              flex: 1, textAlign: 'center', padding: '8px', borderRadius: 8, cursor: 'pointer',
              background: '#101C2C', color: '#fff', fontSize: 11.5, fontWeight: 600,
            }}>✓ Approve</div>
            <div onClick={() => onDecide(r, 'rejected')} style={{
              flex: 1, textAlign: 'center', padding: '8px', borderRadius: 8, cursor: 'pointer',
              border: '1.5px solid #C1442A', color: '#C1442A', fontSize: 11.5, fontWeight: 600,
            }}>✕ Reject</div>
          </div>
        </div>
      ))}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
